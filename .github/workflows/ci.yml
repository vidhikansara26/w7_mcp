name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests (business logic and agent loop)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff mypy

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Unit tests
        run: pytest test_business_logic.py test_agent.py test_score.py -v

      # Intentionally no Ollama / live MCP smoke in CI.
